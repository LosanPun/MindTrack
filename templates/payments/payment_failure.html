{% extends "base.html" %}

{% block title %}Payment Failed{% endblock %}

{% block content %}
<div style="max-width: 760px; margin: 40px auto; padding: 24px; background: #ffffff; border: 1px solid #fed7d7; border-radius: 12px;">
    <h1 style="margin-top: 0; color: #9b2c2c;">Payment Failed</h1>
    <p>Your Khalti payment could not be verified.</p>
    {% if reason %}<p><strong>Reason:</strong> {{ reason }}</p>{% endif %}
    <p><strong>Status:</strong> {{ data.status|default:"Failed" }}</p>
    <a href="{% url 'dashboard' %}" style="display: inline-block; margin-top: 12px; padding: 10px 16px; background: #0a1931; color: #fff; text-decoration: none; border-radius: 8px;">Return to Dashboard</a>
</div>
{% endblock %}
