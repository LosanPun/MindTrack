{% extends "base.html" %}

{% block title %}Password Updated - MindTrack{% endblock %}
{% block body_class %}auth-page{% endblock %}

{% block content %}
<div class="container" style="max-width: 560px; min-height: auto;">
    <div class="form-container" style="padding: 44px 36px; text-align: center;">
        <div class="form-header" style="margin-bottom: 20px;">
            <h1>Password updated</h1>
            <p>Your password has been changed successfully. You can now sign in.</p>
        </div>
        <a href="{% url 'login' %}" class="btn btn-primary" style="text-decoration: none;">Sign In</a>
    </div>
</div>
{% endblock %}
